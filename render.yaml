# One-click backend + Postgres on Render (https://render.com). Free tier sleeps when idle.
services:
  - type: web
    name: lifora-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://lifora-rouge.vercel.app
      - key: FRONTEND_URL
        value: https://lifora-rouge.vercel.app
      - key: TRUST_PROXY
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Required in production: without SMTP, sign-up returns 503. Set these in the Render dashboard.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lifora-db
          property: connectionString
databases:
  - name: lifora-db
    plan: free
